name: Build And Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/next_ddl-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/next_ddl-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Visual Studio ATL component
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio installation path was not found."
          }
          Start-Process -FilePath $installer -ArgumentList @(
            "modify",
            "--installPath", $installPath,
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--passive",
            "--norestart"
          ) -Wait

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Android SDK components
        id: android_sdk_cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/licenses
          key: ${{ runner.os }}-android-sdk-cmake-3.22.1-ndk-28.2.13676358
          restore-keys: |
            ${{ runner.os }}-android-sdk-cmake-3.22.1-
            ${{ runner.os }}-android-sdk-

      - name: Prewarm Android CMake/NDK
        if: steps.android_sdk_cache.outputs.cache-hit != 'true'
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/next_ddl-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/next_ddl-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify ARM64-only APK
        run: |
          ABIS=$(unzip -Z -1 build/app/outputs/flutter-apk/app-release.apk | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u)
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected APK ABIs: $ABIS"
            exit 1
          fi

      - name: Generate APK checksum
        working-directory: build/app/outputs/flutter-apk
        run: sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 中文
            - 修复调整控件圆角或主色时图片背景被旧设置覆盖的问题。
            - 修复取消换图后原背景文件被提前删除的问题。
            - 新增最近 5 张背景图片的缩略图入口，重启后仍可快速恢复。
            - 恢复背景时同步恢复缩放、位置、旋转、遮罩和模糊参数，保留当前主色和圆角。
            - 新增编辑当前背景入口及图片不可用提示，补齐中文、英文、日文界面。
            - 明确限制 Android 发布包为 ARM64，排除插件附带的其他架构库。
            - 图片编辑器初始完整显示原图，支持用户自由缩放和裁切；历史背景支持长按确认删除。

            ## English
            - Fix stale theme settings overwriting the wallpaper when changing control radius or primary color.
            - Keep the original background file when canceling a replacement.
            - Add thumbnails for the five most recent backgrounds, retained across restarts for quick restoration.
            - Restore scale, position, rotation, overlay, and blur without resetting the current color or corner radius.
            - Add an entry to edit the current wallpaper and unavailable-image feedback in Chinese, English, and Japanese.
            - Enforce ARM64-only Android releases and exclude other architectures bundled by plugins.
            - Show the full source image initially in the editor, allow free zoom/cropping, and support long-press removal of recent backgrounds.
          files: |
            release-assets/windows-release.zip
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
