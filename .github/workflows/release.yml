name: Build And Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/next_ddl-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/next_ddl-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Visual Studio ATL component
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio installation path was not found."
          }
          Start-Process -FilePath $installer -ArgumentList @(
            "modify",
            "--installPath", $installPath,
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--passive",
            "--norestart"
          ) -Wait

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Android SDK components
        id: android_sdk_cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/licenses
          key: ${{ runner.os }}-android-sdk-cmake-3.22.1-ndk-28.2.13676358
          restore-keys: |
            ${{ runner.os }}-android-sdk-cmake-3.22.1-
            ${{ runner.os }}-android-sdk-

      - name: Prewarm Android CMake/NDK
        if: steps.android_sdk_cache.outputs.cache-hit != 'true'
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/next_ddl-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/next_ddl-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify ARM64-only APK
        run: |
          ABIS=$(unzip -Z -1 build/app/outputs/flutter-apk/app-release.apk | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u)
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected APK ABIs: $ABIS"
            exit 1
          fi

      - name: Generate APK checksum
        working-directory: build/app/outputs/flutter-apk
        run: sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 中文
            - 桌面小组件的任务切换改为底部弹出的可滚动列表，无需进入应用即可直接选择任务，不再盲目循环切换。
            - 列表显示任务名称、剩余时间、截止日期及当前选中标记；取消、下拉关闭或返回不会改变选择，每个小组件独立保留展示任务。
            - 保留 3×2 响应式布局、应用内星标和中/英/日适配，并防止已完成、已删除或被导入替换的任务被误选。
            - 应用图标改为上半部分的方形头肩构图，移除完整竖图缩放造成的两侧窄边，统一更新 Android、Windows 和 README 图标。

            ## English
            - Replace blind widget task cycling with a scrollable bottom-sheet picker on the home screen, without opening the main app.
            - Preview task titles, remaining time and deadlines with a current-selection checkmark. Cancel, swipe down or go back without changing the selection; each widget keeps its own task.
            - Preserve responsive 3×2 layouts, in-app stars and Chinese/English/Japanese text, and reject completed, deleted or replaced tasks.
            - Reframe the app icon as a square upper-body portrait to remove the side letterboxing from fitting the full portrait, and update Android, Windows and README icons together.
          files: |
            release-assets/windows-release.zip
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
