name: Build And Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/next_ddl-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/next_ddl-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install Visual Studio ATL component
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installPath) {
            throw "Visual Studio installation path was not found."
          }
          Start-Process -FilePath $installer -ArgumentList @(
            "modify",
            "--installPath", $installPath,
            "--add", "Microsoft.VisualStudio.Component.VC.ATL",
            "--passive",
            "--norestart"
          ) -Wait

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-release.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: windows-release.zip

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Android SDK components
        id: android_sdk_cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/cmake/3.22.1
            /usr/local/lib/android/sdk/ndk/28.2.13676358
            /usr/local/lib/android/sdk/licenses
          key: ${{ runner.os }}-android-sdk-cmake-3.22.1-ndk-28.2.13676358
          restore-keys: |
            ${{ runner.os }}-android-sdk-cmake-3.22.1-
            ${{ runner.os }}-android-sdk-

      - name: Prewarm Android CMake/NDK
        if: steps.android_sdk_cache.outputs.cache-hit != 'true'
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses > /dev/null || true
          "${SDKMANAGER}" --install "cmake;3.22.1" "ndk;28.2.13676358"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.38.3"
          cache: true
          pub-cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Prepare Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/next_ddl-upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/next_ddl-upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Build Android release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify ARM64-only APK
        run: |
          ABIS=$(unzip -Z -1 build/app/outputs/flutter-apk/app-release.apk | awk -F/ '$1 == "lib" && NF > 2 { print $2 }' | sort -u)
          if [ "$ABIS" != "arm64-v8a" ]; then
            echo "Unexpected APK ABIs: $ABIS"
            exit 1
          fi

      - name: Generate APK checksum
        working-directory: build/app/outputs/flutter-apk
        run: sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-android
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## 中文
            - 新增背景文字自动对比度：分析实际背景的主色调与相对亮度，深色背景使用浅字，浅色背景使用深字，混合明暗区域辅以细微文字光晕。
            - 覆盖时间线、提醒标题、首页摘要与空状态、透明编辑表单、备份和规划页；卡片、带底色的控件和弹窗保留原有配色。
            - 背景裁切、缩放、旋转、模糊和遮罩后的最终画面参与判断；低分辨率采样仅随背景重绘更新，不随倒计时或页面切换重复解码壁纸。
            - 保留中/英/日适配、Android 小组件任务选择和原有数据格式，补充对比度、背景稳定性及 Android 渲染验证。

            ## English
            - Add automatic wallpaper text contrast using the rendered background's dominant colors and relative luminance: light text on dark backgrounds, dark text on light backgrounds, and subtle halos for mixed areas.
            - Cover timelines, reminder headings, home summaries and empty states, transparent forms, backups and planning while preserving card, filled-control and dialog color pairs.
            - Analyze the final crop, zoom, rotation, blur and overlay with low-resolution samples on background repaints, without re-decoding wallpaper during countdown ticks or navigation.
            - Preserve Chinese/English/Japanese support, Android widget task picking and existing data formats, with contrast, wallpaper stability and Android-renderer tests.
          files: |
            release-assets/windows-release.zip
            release-assets/app-release.apk
            release-assets/app-release.apk.sha256
